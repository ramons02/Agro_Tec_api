services:
  - type: web
    name: agrotec-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: INMET_BASE_URL
        value: https://apitempo.inmet.gov.br
      # As rotas de medicao do INMET nao devolvem dado (404/204). Desligado: a ingestao vai direto ao
      # Open-Meteo (~20 a 32 estacoes do PA, cerca de 1.000 a 1.500 chamadas/dia, bem abaixo do
      # limite gratis de 10.000/dia); o catalogo de estacoes segue lido. "true" volta a tentar o INMET.
      - key: INMET_ENABLED
        value: "false"
      # O Render usa IP de saida compartilhado que o Open-Meteo bloqueia (429); o trafego passa pelo
      # Worker da Cloudflare (Agro_Tec_infra/cloudflare-openmeteo-proxy), que exige X-Proxy-Key.
      - key: OPENMETEO_BASE_URL
        value: https://agroclima-openmeteo-proxy.cloudflare-openmeteo-proxy.workers.dev
      - key: OPENMETEO_PROXY_KEY
        sync: false
      # MET Norway: reserva do Open-Meteo. Exige User-Agent que identifique o app com contato,
      # ex.: "AgroClimaPara/1.0 (contato@seudominio.com.br)". Vazio usa um padrao com o repositorio.
      - key: METNO_USER_AGENT
        sync: false
