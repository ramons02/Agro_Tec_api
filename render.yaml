services:
  - type: web
    name: agrotec-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      # E-mail de redefinicao de senha. O Render gratis bloqueia SMTP (portas 25, 465 e 587), entao o envio vai
      # pela API HTTPS do Brevo. EMAIL_FROM precisa ser um remetente verificado no Brevo.
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: AgroClima Pará
      # Alertas de pulverizacao: token do BotFather e @usuario do bot (sem o @). Sem token, so loga.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # O Render usa IP de saida compartilhado que o Open-Meteo bloqueia (429); o trafego passa pelo
      # Worker da Cloudflare (Agro_Tec_infra/cloudflare-openmeteo-proxy), que exige X-Proxy-Key.
      - key: OPENMETEO_BASE_URL
        value: https://agroclima-openmeteo-proxy.cloudflare-openmeteo-proxy.workers.dev
      - key: OPENMETEO_PROXY_KEY
        sync: false
      # MET Norway: reserva do Open-Meteo. Exige User-Agent que identifique o app com contato,
      # ex.: "AgroClimaPara/1.0 (contato@seudominio.com.br)". Vazio usa um padrao com o repositorio.
      - key: METNO_USER_AGENT
        sync: false
