services:
  - type: web
    name: agrotec-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: INMET_BASE_URL
        value: https://apitempo.inmet.gov.br
      # O Render usa IP de saida compartilhado que o Open-Meteo bloqueia (429); o trafego passa pelo
      # Worker da Cloudflare (Agro_Tec_infra/cloudflare-openmeteo-proxy), que exige X-Proxy-Key.
      - key: OPENMETEO_BASE_URL
        value: https://agroclima-openmeteo-proxy.cloudflare-openmeteo-proxy.workers.dev
      - key: OPENMETEO_PROXY_KEY
        sync: false
