spring:
  application:
    name: agrotec-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/agroclima_dev?currentSchema=java,public}
    username: ${DATABASE_USER:ramon}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    schemas: ${SPRING_FLYWAY_SCHEMAS:java}
    default-schema: ${SPRING_FLYWAY_DEFAULT_SCHEMA:java}
    create-schemas: ${SPRING_FLYWAY_CREATE_SCHEMAS:true}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:1}
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:chave-de-desenvolvimento-trocar-em-producao}
    algorithm: HS256
    expiration-hours: 24
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5180}
    origin-regex: ${CORS_ORIGIN_REGEX:}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5180}
  smtp:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    user: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:}
  inmet:
    base-url: ${INMET_BASE_URL:https://apitempo.inmet.gov.br}
  openmeteo:
    base-url: ${OPENMETEO_BASE_URL:https://api.open-meteo.com}

server:
  port: ${PORT:8000}
