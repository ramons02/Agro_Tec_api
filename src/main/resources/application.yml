spring:
  application:
    name: agrotec-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/agroclima_dev?currentSchema=java,public}
    username: ${DATABASE_USER:ramon}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    schemas: ${SPRING_FLYWAY_SCHEMAS:java}
    default-schema: ${SPRING_FLYWAY_DEFAULT_SCHEMA:java}
    create-schemas: ${SPRING_FLYWAY_CREATE_SCHEMAS:true}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:1}
  jackson:
    property-naming-strategy: SNAKE_CASE

app:
  jwt:
    secret: ${JWT_SECRET}
    algorithm: HS256
    expiration-hours: 24
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5180}
    origin-regex: ${CORS_ORIGIN_REGEX:}
  cadastro:
    limite-por-hora: ${CADASTRO_LIMITE_POR_HORA:3}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5180}
  smtp:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    user: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:}
  email:
    brevo-api-key: ${BREVO_API_KEY:}
    from: ${EMAIL_FROM:}
    from-name: ${EMAIL_FROM_NAME:AgroClima Pará}
    brevo-base-url: ${BREVO_BASE_URL:https://api.brevo.com}
  openmeteo:
    base-url: ${OPENMETEO_BASE_URL:https://api.open-meteo.com}
    proxy-key: ${OPENMETEO_PROXY_KEY:}
  metno:
    base-url: ${METNO_BASE_URL:https://api.met.no}
    user-agent: ${METNO_USER_AGENT:}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-username: ${TELEGRAM_BOT_USERNAME:}
    base-url: ${TELEGRAM_BASE_URL:https://api.telegram.org}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}

server:
  port: ${PORT:8000}
