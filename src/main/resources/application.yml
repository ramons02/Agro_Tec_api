spring:
  application:
    name: agrotec-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/agroclima_java_dev}
    username: ${DATABASE_USER:ramon}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:chave-de-desenvolvimento-trocar-em-producao}
    algorithm: HS256
    expiration-hours: 24
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5180}
    origin-regex: ${CORS_ORIGIN_REGEX:}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5180}
  smtp:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    user: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:}

server:
  port: ${PORT:8000}
