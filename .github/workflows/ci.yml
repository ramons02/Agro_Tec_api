name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ramon
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: agroclima_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Garantir extensao PostGIS
        env:
          PGPASSWORD: ci-postgres-password
        run: psql -h localhost -U ramon -d agroclima_dev -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: mvn test
        env:
          DATABASE_PASSWORD: ci-postgres-password
        run: mvn test
